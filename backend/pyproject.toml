[project]
name = "commerce-platform-backend"
version = "0.1.0"
description = "Backend for the commerce-platform multi-store e-commerce platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery",
    "django>=5.2,<5.3",
    "django-environ",
    "django-filter",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "drf-spectacular",
    "psycopg[binary]",
    "redis",
]

[dependency-groups]
dev = [
    "factory-boy",
    "pytest",
    "pytest-django",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
