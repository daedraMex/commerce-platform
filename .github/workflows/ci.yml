name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shop
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-not-a-secret-change-me-0123456789
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://shop:shop@localhost:5432/shop
      REDIS_URL: redis://localhost:6379/0
      PYTEST_ADDOPTS: "-p no:cacheprovider"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Verify actions are pinned to a commit SHA
        run: |
          set -euo pipefail
          status=0
          while IFS=: read -r file line_no rest; do
            ref="${rest#*uses:}"
            ref="${ref%%#*}"
            ref="$(printf '%s' "$ref" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ ! "$ref" =~ ^[^@]+@[0-9a-f]{40}$ ]]; then
              echo "::error file=$file,line=$line_no::$ref is not pinned to a commit SHA"
              status=1
            fi
          done < <(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/)
          exit "$status"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check
        run: ./scripts/check.sh
