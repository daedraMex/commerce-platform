services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${R2_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${R2_SECRET_ACCESS_KEY:-minioadmin}"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${R2_ACCESS_KEY_ID:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${R2_SECRET_ACCESS_KEY:-minioadmin}"
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-catalog-media}"
      R2_PRIVATE_BUCKET_NAME: "${R2_PRIVATE_BUCKET_NAME:-catalog-private}"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$R2_BUCKET_NAME"
        mc mb --ignore-existing "local/$$R2_PRIVATE_BUCKET_NAME"
        mc anonymous set download "local/$$R2_BUCKET_NAME"
        mc anonymous set none "local/$$R2_PRIVATE_BUCKET_NAME"

  worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info
    environment:
      SECRET_KEY: "${SECRET_KEY:-change-me}"
      DEBUG: "${DEBUG:-True}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop
      REDIS_URL: redis://redis:6379/0
      R2_BUCKET_NAME: "${R2_BUCKET_NAME:-}"
      R2_PRIVATE_BUCKET_NAME: "${R2_PRIVATE_BUCKET_NAME:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_ENDPOINT_URL: "${R2_ENDPOINT_URL:-http://minio:9000}"
      MEDIA_BASE_URL: "${MEDIA_BASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
